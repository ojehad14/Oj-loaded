<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>OJ LOADED</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="OJ LOADED">
<link rel="apple-touch-icon" href="oj-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #14161a;
    --surface: #1c1f26;
    --surface-2: #262a33;
    --border: #34394480;
    --text: #ece9e2;
    --text-dim: #8b909c;
    --accent: #e8a33d;
    --accent-2: #c4453b;
    --green: #4a8c5f;
    --radius: 10px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { overscroll-behavior-y: none; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    padding: max(28px, env(safe-area-inset-top)) 16px 60px;
  }
  .wrap { max-width: 760px; margin: 0 auto; }

  header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 22px; flex-wrap: wrap; gap: 10px; }
  h1 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 46px;
    letter-spacing: 2px;
    margin: 0;
    line-height: 1;
    color: var(--accent);
  }
  h1 span { color: var(--text); }
  .tagline {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--text-dim);
  }
  .unit-toggle { display: flex; background: var(--surface); border: 1px solid var(--border); border-radius: 999px; padding: 3px; }
  .unit-toggle button {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px; font-weight: 700; padding: 6px 14px; border-radius: 999px; border: none;
    background: transparent; color: var(--text-dim); cursor: pointer;
  }
  .unit-toggle button.active { background: var(--accent); color: #14161a; }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; margin-bottom: 18px; }
  .card h2 { font-family: 'Bebas Neue', sans-serif; font-size: 22px; letter-spacing: 1px; margin: 0 0 4px; color: var(--text-dim); }
  .card .sub { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--text-dim); margin-bottom: 14px; }
  .card .sub b { color: var(--accent); }

  .day-tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 16px; }
  .day-tabs button {
    position: relative;
    font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700;
    padding: 8px 13px; border-radius: 7px; border: 1px solid var(--border);
    background: var(--surface-2); color: var(--text-dim); cursor: pointer;
  }
  .day-tabs button.active { background: var(--accent); color: #14161a; border-color: var(--accent); }
  .day-tabs button .dot { position: absolute; top: -4px; right: -4px; width: 8px; height: 8px; border-radius: 50%; background: var(--green); border: 1.5px solid var(--bg); }

  label { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .5px; color: var(--text-dim); margin-bottom: 5px; font-weight: 600; }
  input {
    width: 100%; background: var(--surface-2); border: 1px solid var(--border); border-radius: 6px;
    color: var(--text); padding: 10px 11px; font-family: 'JetBrains Mono', monospace; font-size: 14px;
  }
  input:focus { outline: none; border-color: var(--accent); }
  .row-2 { display: grid; grid-template-columns: 2fr 1fr; gap: 10px; margin-bottom: 8px; }
  .date-chips { display: flex; gap: 6px; margin-bottom: 14px; }
  .date-chips button {
    font-family: 'JetBrains Mono', monospace; font-size: 11px; padding: 5px 10px; border-radius: 6px;
    border: 1px solid var(--border); background: var(--surface-2); color: var(--text-dim); cursor: pointer;
  }
  .date-chips button.active { border-color: var(--accent); color: var(--accent); }

  .sets-block { margin-top: 4px; }
  .set-row { display: grid; grid-template-columns: 24px 1fr 1fr 32px; gap: 8px; align-items: center; margin-bottom: 8px; }
  .set-row .idx { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--text-dim); text-align: center; }
  .set-row .rm { background: none; border: none; color: var(--text-dim); cursor: pointer; font-size: 15px; }
  .set-row .rm:hover { color: var(--accent-2); }
  .add-set-btn {
    background: var(--surface-2); border: 1px dashed var(--border); color: var(--text-dim);
    font-family: 'JetBrains Mono', monospace; font-size: 12px; padding: 8px 12px; border-radius: 6px;
    cursor: pointer; width: 100%; margin-top: 2px;
  }
  .add-set-btn:hover { color: var(--accent); border-color: var(--accent); }

  button.primary {
    margin-top: 16px; width: 100%; background: var(--accent); color: #14161a; border: none; border-radius: 6px;
    padding: 12px; font-family: 'Bebas Neue', sans-serif; font-size: 18px; letter-spacing: 1px; cursor: pointer;
  }
  button.primary:active { filter: brightness(0.95); }

  .result-banner {
    display: none; margin-top: 12px; padding: 12px 14px; border-radius: 8px;
    background: var(--surface-2); border: 1px solid var(--border);
    font-family: 'JetBrains Mono', monospace; font-size: 13px; color: var(--text);
  }
  .result-banner.show { display: block; }
  .result-banner .pct-up { color: var(--green); font-weight: 700; }
  .result-banner .pct-down { color: var(--accent-2); font-weight: 700; }
  .result-banner .pct-flat { color: var(--text-dim); font-weight: 700; }

  .bar-scene { display: flex; align-items: center; justify-content: center; padding: 22px 0 10px; overflow-x: auto; }
  .bar-caption { text-align: center; font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--text-dim); margin-top: 6px; }
  .bar-caption b { color: var(--accent); font-size: 15px; }

  .streak-row { display: flex; gap: 20px; margin-bottom: 16px; flex-wrap: wrap; }
  .streak-stat .num { font-family: 'Bebas Neue', sans-serif; font-size: 34px; color: var(--accent); line-height: 1; }
  .streak-stat .lbl { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--text-dim); text-transform: uppercase; letter-spacing: .5px; }
  .heatmap-scroll { overflow-x: auto; padding-bottom: 4px; }

  .ex-item { border-bottom: 1px solid var(--border); padding: 14px 0; }
  .ex-item:last-child { border-bottom: none; }
  .ex-row { display: flex; justify-content: space-between; align-items: center; cursor: pointer; gap: 10px; }
  .ex-name { font-weight: 700; font-size: 15px; }
  .ex-meta { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--text-dim); margin-top: 3px; }
  .ex-pr { text-align: right; font-family: 'JetBrains Mono', monospace; }
  .ex-pr .num { color: var(--accent); font-weight: 700; font-size: 16px; }
  .ex-pr .lbl { font-size: 10px; color: var(--text-dim); text-transform: uppercase; letter-spacing: .5px; }
  .ex-detail { display: none; margin-top: 14px; }
  .ex-detail.open { display: block; }
  .spark { margin-top: 8px; }
  .session-row { padding: 8px 0; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .session-row:last-child { border-bottom: none; }
  .session-left { font-family: 'JetBrains Mono', monospace; font-size: 12px; }
  .session-date { color: var(--text-dim); margin-bottom: 4px; }
  .set-chip { display: inline-block; background: var(--surface-2); border: 1px solid var(--border); border-radius: 5px; padding: 2px 7px; margin: 0 4px 4px 0; font-size: 12px; }
  .del { background: none; border: none; color: var(--text-dim); cursor: pointer; font-size: 14px; flex-shrink: 0; }
  .del:hover { color: var(--accent-2); }
  .empty { color: var(--text-dim); font-size: 13px; text-align: center; padding: 20px 0; font-family: 'JetBrains Mono', monospace; }
  .chip { display: inline-block; font-family: 'JetBrains Mono', monospace; font-size: 11px; padding: 3px 8px; border-radius: 999px; background: var(--surface-2); color: var(--text-dim); border: 1px solid var(--border); }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div>
      <h1>OJ <span>LOADED</span></h1>
      <div class="tagline">Just for you. Every set, on record.</div>
    </div>
    <div class="unit-toggle" id="unitToggle">
      <button data-unit="kg" class="active">KG</button>
      <button data-unit="lbs">LBS</button>
    </div>
  </header>

  <div class="card">
    <h2>Streak</h2>
    <div class="sub">Based on sticking to your Push / Pull / Legs order</div>
    <div class="streak-row">
      <div class="streak-stat"><div class="num" id="curStreak">0</div><div class="lbl">Current streak</div></div>
      <div class="streak-stat"><div class="num" id="longStreak">0</div><div class="lbl">Longest streak</div></div>
      <div class="streak-stat"><div class="num" id="totalSessions">0</div><div class="lbl">Total sessions</div></div>
    </div>
    <div class="heatmap-scroll" id="heatmap"></div>
  </div>

  <div class="card">
    <h2>Log a session</h2>
    <div class="sub" id="logSub"></div>
    <div class="day-tabs" id="logDayTabs"></div>

    <div class="row-2">
      <div>
        <label for="exName">Exercise</label>
        <input id="exName" list="exList" placeholder="e.g. Dumbbell Chest Press" autocomplete="off">
        <datalist id="exList"></datalist>
      </div>
      <div>
        <label for="fDate">Date</label>
        <input id="fDate" type="date">
      </div>
    </div>
    <div class="date-chips" id="dateChips">
      <button data-set="today">Today</button>
      <button data-set="yesterday">Yesterday</button>
    </div>

    <label>Sets</label>
    <div class="sets-block" id="setsBlock"></div>
    <button class="add-set-btn" id="addSetBtn">+ Add set</button>

    <button class="primary" id="logBtn">LOG SESSION</button>
    <div class="result-banner" id="resultBanner"></div>
  </div>

  <div class="card">
    <h2>Last set loaded</h2>
    <div class="bar-scene" id="barScene"></div>
    <div class="bar-caption" id="barCaption">Log your first set to load the bar.</div>
  </div>

  <div class="card">
    <h2>Your exercises</h2>
    <div class="day-tabs" id="filterDayTabs"></div>
    <div id="exerciseList"><div class="empty">No sessions logged yet.</div></div>
  </div>

</div>

<script>
const STORE_KEY = 'oj-loaded-sessions';
const SPLIT_DAYS = ['Push 1', 'Pull 1', 'Legs', 'Push 2', 'Pull 2'];
let entries = []; // {id, day, exercise, date, sets:[{weightKg, reps}], createdAt}
let unit = 'kg';
let logDay = SPLIT_DAYS[0];
let filterDay = 'All';
let selectedDateMode = 'today'; // 'today' | 'yesterday' | 'custom'

const KG_PLATES = [25,20,15,10,5,2.5,1.25];
const LBS_PLATES = [45,35,25,10,5,2.5];
const PLATE_COLOR = { 25:'#c4453b', 45:'#c4453b', 20:'#3d6fc4', 35:'#3d6fc4', 15:'#e8c53d', 10:'#4a8c5f', 5:'#ece9e2', 2.5:'#2b2e35', 1.25:'#9aa0ab' };
const BAR_WEIGHT = { kg: 20, lbs: 45 };

function kgToLbs(kg){ return kg * 2.20462; }
function lbsToKg(lbs){ return lbs / 2.20462; }
function toDisplay(weightKg){ return unit === 'kg' ? weightKg : kgToLbs(weightKg); }
function fmt(n){ return Math.round(n * 100) / 100; }
function isoDate(d){ return d.toISOString().slice(0,10); }
function todayISO(){ return isoDate(new Date()); }
function yesterdayISO(){ const d = new Date(); d.setDate(d.getDate()-1); return isoDate(d); }
function cssId(name){ return name.replace(/[^a-zA-Z0-9]/g, '_'); }

/* Smart default: past-midnight-to-4am sessions are almost always "yesterday's" workout */
function smartDefaultDate(){
  const now = new Date();
  if (now.getHours() < 4) { selectedDateMode = 'yesterday'; return yesterdayISO(); }
  selectedDateMode = 'today';
  return todayISO();
}

/* ---------- Storage (on-device, localStorage) ---------- */
function loadEntries(){
  try { const raw = localStorage.getItem(STORE_KEY); entries = raw ? JSON.parse(raw) : []; }
  catch (e) { entries = []; }
}
function saveEntries(){
  try { localStorage.setItem(STORE_KEY, JSON.stringify(entries)); }
  catch (e) { console.error('Storage error', e); }
}

/* ---------- Day tabs ---------- */
function suggestedDay(){
  if (entries.length === 0) return SPLIT_DAYS[0];
  const latest = [...entries].sort((a,b) => b.createdAt - a.createdAt)[0];
  const idx = SPLIT_DAYS.indexOf(latest.day);
  return SPLIT_DAYS[(idx + 1) % SPLIT_DAYS.length];
}

function renderLogDayTabs(){
  const suggestion = suggestedDay();
  const el = document.getElementById('logDayTabs');
  el.innerHTML = SPLIT_DAYS.map(d => `
    <button data-day="${d}" class="${d === logDay ? 'active' : ''}">
      ${d}${d === suggestion ? '<span class="dot" title="Up next in your split"></span>' : ''}
    </button>`).join('');
  el.querySelectorAll('button').forEach(btn => {
    btn.addEventListener('click', () => {
      logDay = btn.dataset.day;
      renderLogDayTabs();
      renderExerciseDatalist();
      applySlotAutofill();
    });
  });
  document.getElementById('logSub').innerHTML = `Split: Push 1 → Pull 1 → Legs → Push 2 → Pull 2 &nbsp;·&nbsp; up next: <b>${suggestion}</b>`;
}

function renderFilterDayTabs(){
  const el = document.getElementById('filterDayTabs');
  const options = ['All', ...SPLIT_DAYS];
  el.innerHTML = options.map(d => `<button data-day="${d}" class="${d === filterDay ? 'active' : ''}">${d}</button>`).join('');
  el.querySelectorAll('button').forEach(btn => {
    btn.addEventListener('click', () => {
      filterDay = btn.dataset.day;
      renderFilterDayTabs();
      renderExerciseList();
    });
  });
}

/* ---------- Date chips ---------- */
function renderDateChips(){
  const el = document.getElementById('dateChips');
  [...el.children].forEach(btn => btn.classList.toggle('active', btn.dataset.set === selectedDateMode));
}
document.getElementById('dateChips').addEventListener('click', (e) => {
  const btn = e.target.closest('button');
  if (!btn) return;
  selectedDateMode = btn.dataset.set;
  document.getElementById('fDate').value = btn.dataset.set === 'today' ? todayISO() : yesterdayISO();
  renderDateChips();
});
document.getElementById('fDate').addEventListener('input', () => {
  const v = document.getElementById('fDate').value;
  selectedDateMode = v === todayISO() ? 'today' : (v === yesterdayISO() ? 'yesterday' : 'custom');
  renderDateChips();
});

/* ---------- Set rows ---------- */
function addSetRow(weight, reps){
  const block = document.getElementById('setsBlock');
  const row = document.createElement('div');
  row.className = 'set-row';
  row.innerHTML = `
    <div class="idx">${block.children.length + 1}</div>
    <input type="number" step="0.5" min="0" placeholder="Weight" class="row-weight" value="${weight ?? ''}">
    <input type="number" step="1" min="0" placeholder="Reps" class="row-reps" value="${reps ?? ''}">
    <button class="rm" title="Remove set">✕</button>
  `;
  row.querySelector('.rm').addEventListener('click', () => { row.remove(); renumberRows(); });
  block.appendChild(row);
}
function renumberRows(){
  [...document.getElementById('setsBlock').children].forEach((row, i) => { row.querySelector('.idx').textContent = i + 1; });
}
function resetSetRows(){ document.getElementById('setsBlock').innerHTML = ''; addSetRow(); }
document.getElementById('addSetBtn').addEventListener('click', () => addSetRow());

/* ---------- Slot-based autofill ---------- */
function sessionsForDay(day, excludeDate){
  const dates = [...new Set(entries.filter(e => e.day === day && e.date !== excludeDate).map(e => e.date))];
  dates.sort((a,b) => a < b ? 1 : -1); // desc
  return dates;
}
function exercisesInOrderForDate(day, date){
  return entries
    .filter(e => e.day === day && e.date === date)
    .sort((a,b) => a.createdAt - b.createdAt)
    .map(e => e.exercise);
}
function applySlotAutofill(){
  const exInput = document.getElementById('exName');
  if (exInput.value.trim()) return; // don't clobber something the user already typed
  const currentDate = document.getElementById('fDate').value || todayISO();
  const slotIndex = entries.filter(e => e.day === logDay && e.date === currentDate).length;
  const pastDates = sessionsForDay(logDay, currentDate);
  if (pastDates.length === 0) return;
  const lastOrder = exercisesInOrderForDate(logDay, pastDates[0]);
  if (lastOrder[slotIndex]) {
    exInput.value = lastOrder[slotIndex];
    exInput.placeholder = 'e.g. Dumbbell Chest Press';
  }
}

/* ---------- Logging ---------- */
document.getElementById('unitToggle').addEventListener('click', (e) => {
  const btn = e.target.closest('button');
  if (!btn) return;
  unit = btn.dataset.unit;
  [...document.querySelectorAll('#unitToggle button')].forEach(b => b.classList.toggle('active', b === btn));
  renderAll();
});

document.getElementById('logBtn').addEventListener('click', () => {
  const name = document.getElementById('exName').value.trim();
  const date = document.getElementById('fDate').value || todayISO();
  const rows = [...document.querySelectorAll('#setsBlock .set-row')];

  if (!name) { alert('Add an exercise name first.'); return; }

  const sets = [];
  for (const row of rows) {
    const w = parseFloat(row.querySelector('.row-weight').value);
    const r = parseInt(row.querySelector('.row-reps').value, 10);
    if (!isNaN(w) && !isNaN(r)) sets.push({ weightKg: unit === 'kg' ? w : lbsToKg(w), reps: r });
  }
  if (sets.length === 0) { alert('Add at least one set with a weight and rep count.'); return; }

  // find previous session for this exercise (before this log) for the improvement %
  const prevSessions = groupIntoSessionsForExercise(name).filter(s => s.date !== date || s.createdAtMax < Date.now());
  const prevTop = prevSessions.length > 0 ? Math.max(...prevSessions[0].sets.map(s => s.weightKg)) : null;
  const newTop = Math.max(...sets.map(s => s.weightKg));

  entries.unshift({
    id: Date.now() + '-' + Math.random().toString(36).slice(2,7),
    day: logDay,
    exercise: name,
    date,
    sets,
    createdAt: Date.now()
  });
  saveEntries();

  showResultBanner(name, newTop, prevTop);

  document.getElementById('exName').value = '';
  resetSetRows();
  renderAll();
  applySlotAutofill();
});

function groupIntoSessionsForExercise(name){
  const relevant = entries.filter(e => e.exercise === name);
  const byDate = {};
  relevant.forEach(e => {
    if (!byDate[e.date]) byDate[e.date] = { date: e.date, sets: [], createdAtMax: 0 };
    byDate[e.date].sets.push(...e.sets);
    byDate[e.date].createdAtMax = Math.max(byDate[e.date].createdAtMax, e.createdAt);
  });
  return Object.values(byDate).sort((a,b) => b.date < a.date ? -1 : 1).sort((a,b) => (a.date < b.date ? 1 : -1));
}

function showResultBanner(name, newTopKg, prevTopKg){
  const banner = document.getElementById('resultBanner');
  const newDisp = fmt(toDisplay(newTopKg));
  if (prevTopKg === null) {
    banner.innerHTML = `First logged session for <b>${name}</b> — ${newDisp} ${unit}. Nothing to compare yet.`;
  } else {
    const pct = ((newTopKg - prevTopKg) / prevTopKg) * 100;
    const prevDisp = fmt(toDisplay(prevTopKg));
    const cls = pct > 0.05 ? 'pct-up' : (pct < -0.05 ? 'pct-down' : 'pct-flat');
    const sign = pct > 0 ? '+' : '';
    banner.innerHTML = `<b>${name}</b>: ${newDisp} ${unit} top set — <span class="${cls}">${sign}${fmt(pct)}%</span> vs last time (${prevDisp} ${unit})`;
  }
  banner.classList.add('show');
}

async function deleteSession(id){
  entries = entries.filter(e => e.id !== id);
  saveEntries();
  renderAll();
}

/* ---------- Datalist ---------- */
function renderExerciseDatalist(){
  const names = [...new Set(entries.filter(e => e.day === logDay).map(e => e.exercise))];
  document.getElementById('exList').innerHTML = names.map(n => `<option value="${n}">`).join('');
}

/* ---------- Barbell visual ---------- */
function buildPlateStack(totalKgPerSide, denominations){
  let remaining = totalKgPerSide;
  const stack = [];
  for (const d of denominations) { while (remaining + 1e-6 >= d) { stack.push(d); remaining -= d; } }
  return stack;
}
function plateVisual(weightDisplay){
  const barWeight = BAR_WEIGHT[unit];
  const weightKg = unit === 'kg' ? weightDisplay : lbsToKg(weightDisplay);
  const barKg = unit === 'kg' ? barWeight : lbsToKg(barWeight);
  const perSide = Math.max(0, (weightKg - barKg) / 2);
  const denominations = unit === 'kg' ? KG_PLATES : LBS_PLATES.map(l => lbsToKg(l));
  const dispDenoms = unit === 'kg' ? KG_PLATES : LBS_PLATES;
  const stackKg = buildPlateStack(perSide, denominations);
  const stack = stackKg.map(kgVal => {
    let best = dispDenoms[0], bestDiff = Infinity;
    for (const d of dispDenoms) {
      const dKg = unit === 'kg' ? d : lbsToKg(d);
      const diff = Math.abs(dKg - kgVal);
      if (diff < bestDiff) { bestDiff = diff; best = d; }
    }
    return best;
  });

  const maxPlateH = 130, minPlateH = 55, plateW = 16;
  const heightFor = (d) => { const maxD = dispDenoms[0]; return minPlateH + (maxPlateH - minPlateH) * (d / maxD); };
  const colorFor = (d) => PLATE_COLOR[d] || '#9aa0ab';

  const svgW = 560, svgH = 170, midY = svgH/2;
  let x = svgW/2 - 30;
  const leftPlates = [];
  stack.forEach(d => { const h = heightFor(d); x -= plateW + 2; leftPlates.push({x, h, color: colorFor(d)}); });
  let x2 = svgW/2 + 30;
  const rightPlates = [];
  stack.forEach(d => { const h = heightFor(d); rightPlates.push({x: x2, h, color: colorFor(d)}); x2 += plateW + 2; });

  const barLeft = Math.min(x - 20, svgW/2 - 60);
  const barRight = Math.max(x2 + 20, svgW/2 + 60);

  let svg = `<svg width="100%" height="${svgH}" viewBox="0 0 ${svgW} ${svgH}" xmlns="http://www.w3.org/2000/svg">`;
  svg += `<line x1="${barLeft}" y1="${midY}" x2="${barRight}" y2="${midY}" stroke="#5b6070" stroke-width="8" stroke-linecap="round" />`;
  [...leftPlates, ...rightPlates].forEach(p => {
    svg += `<rect x="${p.x}" y="${midY - p.h/2}" width="${plateW}" height="${p.h}" rx="3" fill="${p.color}" stroke="#00000040" />`;
  });
  svg += `<rect x="${x-6}" y="${midY-14}" width="6" height="28" rx="2" fill="#5b6070" />`;
  svg += `<rect x="${x2}" y="${midY-14}" width="6" height="28" rx="2" fill="#5b6070" />`;
  svg += `</svg>`;
  return svg;
}

function topSetOf(session){ return session.sets.reduce((m, s) => s.weightKg > m.weightKg ? s : m, session.sets[0]); }

function renderBarScene(){
  const barScene = document.getElementById('barScene');
  const barCaption = document.getElementById('barCaption');
  if (entries.length === 0) {
    barScene.innerHTML = plateVisual(0);
    barCaption.innerHTML = 'Log your first set to load the bar.';
    return;
  }
  const last = [...entries].sort((a,b) => b.createdAt - a.createdAt)[0];
  const top = topSetOf(last);
  const disp = fmt(toDisplay(top.weightKg));
  barScene.innerHTML = plateVisual(disp);
  barCaption.innerHTML = `<b>${disp} ${unit}</b> &nbsp;·&nbsp; ${last.exercise} (${last.day}) &nbsp;·&nbsp; top set ${top.reps} reps`;
}

/* ---------- Sparkline ---------- */
function sparkline(sessions){
  const points = [...sessions].reverse().slice(-12);
  if (points.length < 2) return '';
  const w = 260, h = 44, pad = 4;
  const vals = points.map(s => toDisplay(topSetOf(s).weightKg));
  const max = Math.max(...vals), min = Math.min(...vals);
  const range = max - min || 1;
  const stepX = (w - pad*2) / (points.length - 1);
  const coords = vals.map((v,i) => { const x = pad + i*stepX; const y = h - pad - ((v - min)/range)*(h - pad*2); return `${x},${y}`; });
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">
    <polyline points="${coords.join(' ')}" fill="none" stroke="#e8a33d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  </svg>`;
}

/* ---------- Streak + heatmap ---------- */
function uniqueDaySessions(){
  const map = {};
  entries.forEach(e => { const key = e.date + '|' + e.day; if (!map[key]) map[key] = { date: e.date, day: e.day }; });
  return Object.values(map).sort((a,b) => a.date < b.date ? -1 : (a.date > b.date ? 1 : 0));
}
function computeStreaks(){
  const sessions = uniqueDaySessions();
  if (sessions.length === 0) return { current: 0, longest: 0, total: 0 };
  let longest = 1, run = 1;
  for (let i = 1; i < sessions.length; i++) {
    const prevIdx = SPLIT_DAYS.indexOf(sessions[i-1].day);
    const curIdx = SPLIT_DAYS.indexOf(sessions[i].day);
    const valid = curIdx === (prevIdx + 1) % SPLIT_DAYS.length;
    run = valid ? run + 1 : 1;
    longest = Math.max(longest, run);
  }
  return { current: run, longest, total: sessions.length };
}
function renderStreak(){
  const { current, longest, total } = computeStreaks();
  document.getElementById('curStreak').textContent = current;
  document.getElementById('longStreak').textContent = longest;
  document.getElementById('totalSessions').textContent = total;
  renderHeatmap();
}
function renderHeatmap(){
  const days = 84; // 12 weeks
  const today = new Date();
  const dateCounts = {};
  entries.forEach(e => { dateCounts[e.date] = (dateCounts[e.date] || 0) + 1; });

  const cell = 12, gap = 3, cols = Math.ceil(days / 7);
  const w = cols * (cell + gap), h = 7 * (cell + gap);
  let svg = `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">`;

  const start = new Date(today); start.setDate(start.getDate() - (days - 1));
  // align to start of week (Sunday)
  const startDow = start.getDay();
  start.setDate(start.getDate() - startDow);

  for (let i = 0; i < days + 7; i++) {
    const d = new Date(start); d.setDate(d.getDate() + i);
    if (d > today) break;
    const iso = isoDate(d);
    const count = dateCounts[iso] || 0;
    const col = Math.floor(i / 7), row = i % 7;
    let fill = '#262a33';
    if (count === 1) fill = '#8a5a25';
    else if (count === 2) fill = '#c37f2e';
    else if (count >= 3) fill = '#e8a33d';
    svg += `<rect x="${col*(cell+gap)}" y="${row*(cell+gap)}" width="${cell}" height="${cell}" rx="2" fill="${fill}"><title>${iso}: ${count} logged</title></rect>`;
  }
  svg += `</svg>`;
  document.getElementById('heatmap').innerHTML = svg;
}

/* ---------- Exercise list ---------- */
function groupByExercise(list){
  const map = {};
  list.forEach(e => { if (!map[e.exercise]) map[e.exercise] = []; map[e.exercise].push(e); });
  Object.values(map).forEach(l => l.sort((a,b) => b.createdAt - a.createdAt));
  return map;
}
function renderExerciseList(){
  const filtered = filterDay === 'All' ? entries : entries.filter(e => e.day === filterDay);
  const grouped = groupByExercise(filtered);
  const names = Object.keys(grouped);
  const listEl = document.getElementById('exerciseList');

  if (names.length === 0) { listEl.innerHTML = '<div class="empty">Nothing logged here yet.</div>'; return; }
  names.sort((a,b) => grouped[b][0].createdAt - grouped[a][0].createdAt);

  listEl.innerHTML = names.map(name => {
    const sessions = grouped[name];
    const last = sessions[0];
    const lastTop = topSetOf(last);
    const allSets = sessions.flatMap(s => s.sets);
    const prSet = allSets.reduce((m, s) => s.weightKg > m.weightKg ? s : m, allSets[0]);
    const lastDisp = fmt(toDisplay(lastTop.weightKg));
    const prDisp = fmt(toDisplay(prSet.weightKg));

    const sessionRows = sessions.map(s => {
      const chips = s.sets.map(st => `<span class="set-chip">${fmt(toDisplay(st.weightKg))}${unit}×${st.reps}</span>`).join('');
      return `
        <div class="session-row">
          <div class="session-left">
            <div class="session-date">${s.date} &nbsp;·&nbsp; <span class="chip">${s.day}</span></div>
            <div>${chips}</div>
          </div>
          <button class="del" data-id="${s.id}" title="Delete session">✕</button>
        </div>`;
    }).join('');

    return `
    <div class="ex-item">
      <div class="ex-row" data-toggle="${name.replace(/"/g,'&quot;')}">
        <div>
          <div class="ex-name">${name}</div>
          <div class="ex-meta">Last top set: ${lastDisp} ${unit} × ${lastTop.reps} &nbsp;·&nbsp; <span class="chip">${sessions.length} session${sessions.length>1?'s':''}</span></div>
        </div>
        <div class="ex-pr"><div class="num">${prDisp} ${unit}</div><div class="lbl">Best set</div></div>
      </div>
      <div class="ex-detail" id="detail-${cssId(name)}">
        <div class="spark">${sparkline(sessions)}</div>
        ${sessionRows}
      </div>
    </div>`;
  }).join('');

  listEl.querySelectorAll('.ex-row').forEach(row => {
    row.addEventListener('click', () => document.getElementById('detail-' + cssId(row.dataset.toggle)).classList.toggle('open'));
  });
  listEl.querySelectorAll('.del').forEach(btn => {
    btn.addEventListener('click', (e) => { e.stopPropagation(); deleteSession(btn.dataset.id); });
  });
}

function renderAll(){
  renderLogDayTabs();
  renderFilterDayTabs();
  renderExerciseDatalist();
  renderBarScene();
  renderExerciseList();
  renderStreak();
}

(function init(){
  loadEntries();
  logDay = suggestedDay();
  document.getElementById('fDate').value = smartDefaultDate();
  renderDateChips();
  resetSetRows();
  renderAll();
  applySlotAutofill();
})();
</script>
